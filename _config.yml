# Site settings
title: Floris Jansen
description: >-
  Hej! I’m Floris, I design and develop for inclusion, accessibility, privacy and sustainability.
baseurl: "" # the subpath
url: "https://fmjansen.nl"
github_username: fmjansen
orcid_id: "0009-0008-6667-1129"

# Build settings
markdown: kramdown

# Collection
collections:
  posts:
    permalink: /:collection/:title/
    output: true

webmentions:
  username: "fmjansen.nl"
  templates:
    webmentions: _includes/webmentions/webmentions.html
  throttle_lookups:
    last_week: daily
    last_month: weekly
    last_year: every 2 weeks
    older: monthly
  js:
    source: false

tag_page_layout: tag_page
tag_page_dir: tag

feed:
  tags: true

deploy:
  - rsync -avz -e "ssh -p 4444"  ./ floris@fmjansen.nl:/var/www/fmjansen/html/

plugins:
  - jekyll-subresource-integrity-hook

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .idea
